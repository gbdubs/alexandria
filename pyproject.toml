[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-work-archive"
version = "0.1.0"
description = "Pharos: local-first search and verified TL1 workspace preservation"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Pharos" }]
dependencies = []

[project.scripts]
ai-work-archive = "ai_work_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_work_archive = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
